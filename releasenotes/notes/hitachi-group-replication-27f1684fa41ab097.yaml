---
features:
  - |
    Hitachi driver: added volume group replication. A generic volume group
    whose group type sets ``consistent_group_replication_enabled`` or
    ``group_replication_enabled`` to ``<is> True`` is replicated as one
    Universal Replicator copy group. ``enable_replication``,
    ``disable_replication``, ``failover_replication`` and
    ``list_replication_targets`` act on the copy group as a whole, so a
    failover preserves write ordering across every member.
  - |
    Hitachi driver: added the ``group_replication_enabled`` volume type
    extra spec, set alongside ``replication_enabled='<is> True'``, which
    Cinder requires on every volume type of a replicated group. A volume
    whose type carries ``<is> True`` for it is not paired when it is created;
    its pair is created by ``enable_replication`` when the volume joins a
    group's copy group. One backend can now serve both models
    at once -- a plain ``replication_enabled`` volume type still pairs at
    create time, unchanged.

    Without this signal a replicated volume created before its Cinder group
    exists is paired immediately, and the later
    ``enable_replication`` fails: the driver pins one mirror unit
    (``hitachi_replication_mun``) and the storage system rejects a second pair
    at it. The group type could not answer the question, because a volume with
    no ``group_id`` yet has no group type to consult.

    The key is unscoped, so the scheduler matches it against the
    ``group_replication_enabled`` pool capability, which the driver reports
    only on a backend configured for replication. A volume of this type cannot
    be placed on a backend that cannot do group replication. The value must be
    exactly ``<is> True``: ``True`` and ``true`` make the type unschedulable,
    ``<is> False`` makes it unschedulable on every backend, and ``<is> true``
    is scheduled but not treated as group-replicated.
  - |
    Hitachi driver: for each copy group, the driver asks the storage systems
    which one holds the secondary side, starting with its own, which answers
    without the peer. A volume that has only a secondary volume is found on
    the storage system whose LDEV carries the volume's label, so one backend
    can hold copy groups in both directions.
  - |
    Hitachi driver: a secondary volume in a replicated group, or bound to a
    copy group by its metadata, is adopted with ``manage_existing`` on the
    storage system that holds the secondary side of its copy group. Adoption
    fails with ``ManageExistingInvalidReference`` when neither storage system
    holds that copy group. Deleting an adopted volume, deleting a group or
    group snapshot that contains one, taking a group snapshot of adopted
    volumes and creating a group from them all act on the storage system that
    holds each volume. An adopted volume can be attached and detached on the
    backend whose storage system holds it. Attaching needs the copy group
    taken over, which leaves the secondary volume in SSWS, or the pair
    deleted; while the pair still replicates, the attach fails with
    MSGID0766.
  - |
    Hitachi driver: a group snapshot of a replicated group is created as one
    crash-consistent Thin Image group on the storage system that holds the
    secondary volumes of every member. When those secondary volumes are not
    all on one storage system, or creating the snapshot fails, the group
    snapshot goes to ``error``, MSGID0809 is logged, and the LDEVs the driver
    created for it are deleted.
  - |
    Hitachi driver: ``failover_replication`` accepts a mode suffix on
    ``secondary_backend_id``. ``<backend_id>:graceful`` splits the copy group
    from the primary storage system, for use while it is reachable.
    ``<backend_id>:emergency`` takes the copy group over from the storage
    system that holds its secondary side, without the primary storage system.
    With no suffix the mode comes from the group type extra spec
    ``hbsd:group_replication_failover_mode``, and is emergency when that spec
    is not ``graceful``. A ``secondary_backend_id`` other than ``default``,
    the ``backend_id`` of the ``replication_device`` option, or that
    ``backend_id`` with a mode suffix is rejected with
    ``InvalidReplicationTarget`` before the driver sends anything to a
    storage system.
  - |
    Hitachi driver: ``failover_replication`` with ``secondary_backend_id``
    set to ``default``, sent to the backend of the source storage system,
    returns a copy group to source-to-DR replication. The driver
    swap-resyncs the pairs from the DR storage system, splits them from the
    source, and swap-resyncs them from the source, waiting after each call
    until the pair of every group member reaches ``PAIR``, or ``PSUS`` and
    ``SSUS`` after the split. A failed call or wait fails with MSGID0806,
    which names the step that failed. The driver reads the pairs on both
    storage systems before it sends anything and continues from where an
    earlier attempt stopped; when the pairs are in a state it cannot continue
    from, it sends nothing and fails with MSGID0821, which lists every pair on
    both storage systems. A mode suffix on ``default`` is rejected with
    ``InvalidReplicationTarget``.
  - |
    Hitachi driver: attaching a volume paired into a group's copy group fails
    with MSGID0766 while its LDEV on the backend's own storage system is the
    secondary side of its pair and not taken over (``SSWS``), as it is
    between the swaps of a group failback. A pair the driver cannot find, or
    whose role it cannot tell, does not block the attach.
fixes:
  - |
    Hitachi driver: Fixed a timed-out wait for a replication pair status
    change raising ``RuntimeError`` instead of the driver's timeout error.
  - |
    Hitachi driver: Fixed a journal volume LDEV being left on the storage
    system when labelling it failed while creating journals.
  - |
    Hitachi driver: Fixed ``update_group`` raising ``TypeError``, which hid
    the original error, when the update failed and no volumes were being
    removed.
