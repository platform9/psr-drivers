---
features:
  - |
    Hitachi driver: added the ``group_replication_enabled`` volume type
    extra spec. A volume whose type carries ``<is> True`` for it is not paired
    when it is created; its pair is created by ``enable_replication`` when the
    volume joins a group's copy group. One backend can now serve both models
    at once -- a plain ``replication_enabled`` volume type still pairs at
    create time, unchanged.

    Without this signal a replicated volume created before its Cinder group
    exists is paired immediately, and the later
    ``enable_replication`` fails: the driver pins one mirror unit
    (``hitachi_replication_mun``) and the storage system rejects a second pair
    at it. The group type could not answer the question, because a volume with
    no ``group_id`` yet has no group type to consult.

    The key is unscoped, so the scheduler matches it against the
    ``group_replication_enabled`` pool capability, which the driver reports
    only on a backend configured for replication. A volume of this type cannot
    be placed on a backend that cannot do group replication. The value must be
    exactly ``<is> True``: ``True`` and ``true`` make the type unschedulable,
    ``<is> False`` makes it unschedulable on every backend, and ``<is> true``
    is scheduled but not treated as group-replicated.
  - |
    Hitachi driver: added ``hitachi_replication_report_pair_status``
    (default ``False``) and ``hitachi_replication_report_pair_status_ttl``
    (default ``300`` seconds). When the first is enabled, each copy group's
    replication pair state is reported as the ``group_replication_pairs`` pool
    capability, so a consumer can read pair state from the scheduler stats
    instead of calling the storage system directly.
upgrade:
  - |
    Hitachi driver: the volume type extra spec
    ``hbsd:group_replication_enabled`` has been renamed to
    ``group_replication_enabled``, and the old key is no longer read. A volume
    whose type carries only the old key is paired at create time, and can then
    never join a copy group. Before upgrading the driver, set
    ``group_replication_enabled='<is> True'`` on every volume type that
    carries the old key, and verify each type on every backend. For PSR this
    is the pre-upgrade volume type check (US-12).
  - |
    Hitachi driver: the ``hitachi_replication_group_only`` option has been
    removed. The ``group_replication_enabled`` volume type extra spec is now
    the only way to stop a volume being paired when it is created. The
    removal is not backwards compatible, and it fails silently: on a backend
    that set the option to ``True``, every replication-enabled volume whose
    type lacks the extra spec is now paired at create time, and nothing
    reports it. Set the extra spec on every such volume type before
    upgrading the driver; for PSR this ordering is required, and is the
    pre-upgrade volume type check (US-12). A volume created in the gap stays
    paired and cannot join a copy group. Delete and recreate it: retyping
    does not help, because the driver decides whether to pair only when the
    volume is created.
  - |
    Hitachi driver: per-copy-group replication pair state is no longer
    reported in the pool capabilities by default. Building that report costs
    one REST call per copy group on every stats poll, against the same
    Configuration Manager endpoint that serves pair creation, so it is now
    opt-in via ``hitachi_replication_report_pair_status``. Set it to ``True``
    to restore the previous behaviour.

    The ``group_replication_peer_initialized`` capability is unaffected and is
    still always reported.
  - |
    Hitachi driver: the ``hitachi_replication_role`` option has been removed.
    For each copy group, the driver now asks the storage systems which one
    holds the secondary side, starting with its own, which answers without
    the peer. A volume that has only a secondary volume is found on the
    storage system whose LDEV carries the volume's label. A line that still
    sets the option in ``cinder.conf`` is ignored and can be deleted.
    Existing volumes need no database migration.
  - |
    Hitachi driver: with ``hitachi_replication_report_pair_status`` enabled,
    a backend that holds the secondary side of its copy groups now reports
    every copy group, with ``group_replication_pairs_enumerated`` set to
    ``True``, whenever its peer can list them. Before, it reported only the
    copy groups it had failed over, and always ``False``.
  - |
    Hitachi driver: ``list_replication_targets`` now raises when the
    backend's own storage system cannot be asked about the copy group, where
    a disaster recovery backend used to return no targets. Adopting a volume
    bound to a copy group, by its metadata or its group, now fails with
    ``ManageExistingInvalidReference`` when neither storage system holds
    that copy group. Adopt such a volume without that binding.
fixes:
  - |
    Hitachi driver: on a backend holding the secondary side of a copy group,
    deleting an adopted volume, deleting a group that contains one, and
    deleting a group snapshot of such volumes now delete their LDEVs on the
    storage system that holds them. Before, these deletes did nothing and
    left the LDEVs behind. A group snapshot of adopted volumes, which used to
    fail, now succeeds. Creating a group from adopted volumes now clones them
    where they live. Before, it cloned the LDEV with the same number on the
    peer storage system, which can belong to another volume.
  - |
    Hitachi driver: a volume adopted from a secondary volume can now be
    attached and detached on the backend whose storage system holds it.
    Attaching needs the copy group taken over, which leaves the secondary
    volume in SSWS, or the pair deleted; while the pair still replicates, the
    attach fails with MSGID0766. Before, every attach of an adopted volume
    failed with MSGID0767.
